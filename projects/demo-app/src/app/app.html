<div class="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8 font-sans">
  <h1 class="text-4xl text-green-400 font-bold mb-6 tracking-wide">
    Rick & Morty Explorer
  </h1>

  <div class="grid md:grid-cols-2 gap-4 mb-6">
    <ui-select
      label="Recurso"
      [options]="resourceOptions"
      [value]="svc.resource()"
      (selectionChange)="onResourceChange($event)"
    />
    
    <ui-select
      label="Filtro por status"
      [options]="statusOptions"
      [value]="svc.statusFilter()"
      [disabled]="svc.resource() !== 'characters'"
      (selectionChange)="onStatusChange($event)"
    />
  </div>

  <ui-table
    [columns]="columns()"
    [rows]="svc.rows()"
    [loading]="svc.loading()"
    [errorMessage]="svc.error()"
    emptyMessage="No hay resultados para este filtro."
    (actionTriggered)="onAction($event)"
  />

  @if (showModal() && selectedRecord()) {
    <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"
         (click)="showModal.set(false)">
      <div (click)="$event.stopPropagation()" class="w-full max-w-lg">
        <ui-card title="Detalle del Registro" [subtitle]="null" elevation="raised">
          <pre class="text-xs text-slate-700 overflow-auto p-4 bg-slate-100 rounded">{{ selectedRecord() | json }}</pre>
          <div class="mt-4 flex justify-end">
            <ui-button label="Cerrar" variant="secondary" (clicked)="showModal.set(false)" />
          </div>
        </ui-card>
      </div>
    </div>
  }
</div>
